name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check:release-version "$GITHUB_REF_NAME"
      - run: bun run check
      - name: Require npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NPM_TOKEN"
          npm whoami
      - name: Publish only when the exact version is absent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          set +e
          view_output="$(npm view "@aihu/scraping@$version" version --registry=https://registry.npmjs.org 2>&1)"
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ]; then
            echo "@aihu/scraping@$version already exists; refusing to republish"
            exit 0
          fi
          if [ "$view_status" -ne 1 ] || ! printf '%s' "$view_output" | grep -q 'E404'; then
            printf '%s\n' "$view_output"
            echo "registry lookup failed without a definitive 404; refusing to publish"
            exit 1
          fi
          npm publish --access public --provenance --registry=https://registry.npmjs.org
